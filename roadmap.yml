# roadmap.yml : progression, source de vérité du pipeline du profil.
#
# Modifier un pourcentage, push, et la GitHub Action régénère
# assets/pipeline.svg.
#
#   progress : 0 à 100
#   status   : (optionnel) passed | running | next | pending
#   focus    : true sur l'étape prioritaire du moment
#
# Vue générale : DEV → SYSTÈMES → CONTENEURS → CI/CD → CLOUD/K8S → OBSERVABILITÉ → PORTFOLIO

titre: "ROADMAP · DEV → DEVOPS & INFRA"
seuil_acquis: 80

stages:
  - label: "1 · FONDAMENTAUX DEV"
    jobs:
      - { name: "PHP / Python / JS", progress: 50 }
      - { name: "Git & GitHub", progress: 60 }
      - { name: "SQL / bases de données", progress: 50 }
      - { name: "HTTP / API REST", progress: 20 }

  - label: "2 · SYSTÈMES & RÉSEAUX"
    jobs:
      - { name: "Linux", progress: 50 }
      - { name: "Réseaux (TCP/IP, DNS)", progress: 85 }
      - { name: "SSH & permissions", progress: 80 }
      - { name: "Scripting (Bash / Python)", progress: 30 }

  - label: "3 · CONTENEURS & HOMELAB"
    focus: true
    jobs:
      - { name: "Docker & Compose", progress: 40 }
      - { name: "Homelab (Proxmox, VM)", progress: 40 }
      - { name: "Déploiement web (reverse proxy, HTTPS)", progress: 70 }

  - label: "4 · CI/CD & AUTOMATISATION"
    jobs:
      - { name: "GitHub Actions / GitLab CI", progress: 25 }
      - { name: "Pipeline test → build → deploy", progress: 25, status: next }
      - { name: "IaC (Ansible / Terraform)", progress: 35, status: next }

  - label: "5 · CLOUD & ORCHESTRATION"
    jobs:
      - { name: "Cloud & infrastructure as code", progress: 10 }
      - { name: "Kubernetes (k3s)", progress: 10 }
      - { name: "GitOps", progress: 0 }

  - label: "6 · OBSERVABILITÉ & SÉCURITÉ"
    jobs:
      - { name: "Monitoring (Prometheus / Grafana)", progress: 0 }
      - { name: "Logs & alertes", progress: 0 }
      - { name: "Sauvegardes & reprise", progress: 0 }
      - { name: "Hardening / DevSecOps", progress: 0 }

  - label: "7 · PROJETS & PORTFOLIO"
    jobs:
      - { name: "Infra reproductible (IaC de bout en bout)", progress: 0 }
      - { name: "Projet CI/CD complet", progress: 0 }
      - { name: "Homelab documenté (runbooks)", progress: 40 }
      - { name: "Projet Kubernetes / GitOps", progress: 20 }
