# roadmap.yml : ma progression, source de vérité du pipeline de mon profil.
#
# Modifier un pourcentage, push, et la GitHub Action régénère
# assets/pipeline.svg.
#
#   progress : 0 à 100
#   status   : (optionnel) passed | running | next | pending
#   focus    : true sur l'étape prioritaire du moment
#
# Objectif : DEV → SYSTEMS → DEVOPS → PLATFORM ENGINEERING

titre: "ROADMAP · DEV → DEVOPS & INFRA"
seuil_acquis: 80

stages:
  - label: BASES SYSTEME
    jobs:
      - { name: "Linux", progress: 40 }
      - { name: "Shell / Bash", progress: 40 }
      - { name: "Git", progress: 60 }
      - { name: "Réseaux / TCP-IP", progress: 10 }
      - { name: "Python / scripting", progress: 40 }
      - { name: "SSH / permissions", progress: 10 }

  - label: DEV & AUTOMATISATION
    jobs:
      - { name: "HTTP / API", progress: 20 }
      - { name: "SQL / bases de données", progress: 50 }
      - { name: "PHP / Symfony", progress: 50 }
      - { name: "JavaScript / TypeScript", progress: 40 }
      - { name: "Tests automatisés", progress: 0 }
      - { name: "Gestion des dépendances", progress: 0 }

  - label: CONTENEURS & HOMELAB
    focus: true
    jobs:
      - { name: "Docker", progress: 50 }
      - { name: "Docker Compose", progress: 20 }
      - { name: "Volumes / réseaux", progress: 10 }
      - { name: "Reverse proxy / TLS", progress: 0 }
      - { name: "Homelab", progress: 40 }
