      - { name: "Terraform", progress: 20 }
      - { name: "Secrets / variables", progress: 0 }
      - { name: "Déploiement automatisé", progress: 0 }

  - label: INFRA & CLOUD
    jobs:
      - { name: "DNS / DHCP / routage", progress: 0 }
      - { name: "Firewall / sécurité réseau", progress: 0 }
      - { name: "Cloud", progress: 0, status: next }
      - { name: "Infrastructure as Code", progress: 20 }
      - { name: "Stockage / sauvegardes", progress: 0 }
      - { name: "IAM / gestion des accès", progress: 0 }

  - label: ORCHESTRATION & OBSERVABILITE
    jobs:
      - { name: "Kubernetes", progress: 10 }
      - { name: "Helm", progress: 0, status: next }
      - { name: "Monitoring / métriques", progress: 0 }
