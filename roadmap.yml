      - { name: "Gestion des vulnérabilités", progress: 0 }
      - { name: "Gestion des incidents", progress: 0 }
      - { name: "Haute disponibilité", progress: 0 }
      - { name: "Disaster recovery", progress: 0 }
      - { name: "Documentation / runbooks", progress: 0 }

  - label: PROJETS & VALIDATION
    jobs:
      - { name: "Infra reproductible", progress: 0 }
      - { name: "Homelab documenté", progress: 0 }
      - { name: "Projet CI/CD complet", progress: 0 }
      - { name: "Projet Kubernetes", progress: 0 }
      - { name: "Open source", progress: 0 }
      - { name: "Certification", progress: 0 }
