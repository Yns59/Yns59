/g><g class="in" style="animation-delay:0.84s"><rect x="24" y="236" width="852" height="34" rx="7" fill="#161b22" stroke="#30363d"/><text x="38" y="258" fill="#39c5cf" font-size="13" xml:space="preserve" font-weight="bold">Cloud</text><text x="196" y="258" fill="#e6edf3" font-size="13" xml:space="preserve" >AWS</text><text x="546" y="258" fill="#e6edf3" font-size="13" xml:space="preserve" >Azure et AWS</text><circle class="pulse" cx="525" cy="253" r="3.5" fill="#3fb950" style="animation-delay:0.6s"/></g><g class="in" style="animation-delay:1.02s"><rect x="24" y="276" width="852" height="34" rx="7" fill="#161b22" stroke="#30363d"/><text x="38" y="298" fill="#39c5cf" font-size="13" xml:space="preserve" font-weight="bold">Sécurité</text><text x="196" y="298" fill="#e6edf3" font-size="13" xml:space="preserve" >Pentest, OWASP</text><text x="546" y="298" fill="#e6edf3" font-size="13" xml:space="preserve" >Pentest, DevSecOps</text><circle class="pulse" cx="525" cy="293" r="3.5" fill="#3fb950" style="animation-delay:0.8s"/></g><g class="in" style="animation-delay:1.20s"><rect x="24" y="316" width="852" height="34" rx="7" fill="#161b22" stroke="#30363d"/><text x="38" y="338" fill="#39c5cf" font-size="13" xml:space="preserve" font-weight="bold">Exploitation</text><text x="196" y="338" fill="#e6edf3" font-size="13" xml:space="preserve" >Systèmes répartis</text><text x="546" y="338" fill="#e6edf3" font-size="13" xml:space="preserve" >Supervision, gestion de parc</text><circle class="pulse" cx="525" cy="333" r="3.5" fill="#3fb950" style="animation-delay:1.0s"/></g><g class="in" style="animation-delay:1.38s"><rect x="24" y="356" width="852" height="34" rx="7" fill="#161b22" stroke="#30363d"/><text x="38" y="378" fill="#39c5cf" font-size="13" xml:space="preserve" font-weight="bold">Dév &amp; data</text><text x="196" y="378" fill="#e6edf3" font-size="13" xml:space="preserve" >API, React, PHP, Big data, IA</text><text x="546" y="378" fill="#e6edf3" font-size="13" xml:space="preserve" >Gestion de projet</text><circle class="pulse" cx="525" cy="373" r="3.5" fill="#3fb950" style="animation-delay:1.2s"/></g><rect x="28" y="414" width="844" height="8" rx="4" fill="#161b22"/><rect class="mv load" x="28" y="414" width="140" height="8" rx="4" fill="#3fb950"/>
