<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 442" width="900" height="442" role="img" aria-label="Programme IPSSI par domaine, deuxième année en cours et troisième année à venir.">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.in{animation:in .35s ease-out backwards}
@keyframes in{from{opacity:0;transform:translateY(5px)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.load{animation:load 2.8s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(704px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.mv{display:none}}
</style>
<rect x="1" y="1" width="898" height="440" rx="12" fill="#0d1117" stroke="#30363d"/>
