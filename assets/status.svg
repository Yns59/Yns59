<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 316" width="900" height="316" role="img" aria-label="Statut : recherche une alternance à partir de septembre 2027 à Lille, rythme 3 semaines en entreprise et 1 semaine à l'école.">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.in{animation:in .35s ease-out backwards}
