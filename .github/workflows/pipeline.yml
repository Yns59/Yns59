name: pipeline-roadmap

on:
  push:
    branches: [main]
    paths:
      - roadmap.yml
      - scripts/build_assets.py
      - .github/workflows/pipeline.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install pyyaml

      - name: Générer les SVG
        run: python scripts/build_assets.py

      - name: Commit si les visuels ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner.svg assets/pipeline.svg
          if git diff --staged --quiet; then
            echo "Rien à commiter."
          else
            git commit -m "chore(pipeline): régénère les visuels du profil"
            git push
          fi
